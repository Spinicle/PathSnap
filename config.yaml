# Shared settings. Change values here, not hardcoded in scripts.
data:
  root: "Student folder/Student folder"  # override with env PATHSNAP_DATA
  train_dir: train
  test_dir: student_test
  eval_dir: null                   # set on the API laptop only (env PATHSNAP_EVAL_DATA)

geo:
  crs_projected: "EPSG:32636"      # kept so data_processing/geo.py still imports; trips are worldwide
  crs_mode: per-trip               # UTM zone picked per trip, see features/candidates.py project_trip

candidates:
  radius_m: 50
  max_k: 8

cv:
  n_splits: 5                      # GroupKFold by trip_id
  seed: 42

hmm:
  sigma_m: null                    # emission noise if needed (tune on train/student_test only)
  beta: 10  # transition scale (tune on train/student_test only)
  max_gap_s: 30

api:
  host: "0.0.0.0"
  port: 8000
